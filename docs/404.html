<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · Fe Cloud</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="assets/style.css" />
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .box { max-width: 520px; text-align: center; }
  .code-404 { font-size: clamp(64px, 14vw, 132px); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(120deg, var(--brand), var(--brand-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .box p { color: var(--text-dim); margin: 14px 0 26px; }
</style>
</head>
<body>
<div class="scroll-progress" aria-hidden="true"></div>
<div class="wrap">
  <div class="box">
    <div class="code-404">404</div>
    <h1 style="font-size:22px;margin:18px 0 0;">这个路径没有内容</h1>
    <p>页面可能已移动，或链接拼写有误。</p>
    <a class="btn btn-primary" href="./">返回首页</a>
  </div>
</div>
</body>
</html>
