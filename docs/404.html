<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Fe Cloud 改版档案</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<link rel="stylesheet" href="assets/style.css" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
  .blank { max-width: 560px; width: 100%; }
  .blank .blank-no {
    font-family: var(--serif);
    font-size: clamp(90px, 16vw, 150px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    margin: 0;
    color: var(--ink);
  }
  .blank-no span { color: var(--accent); }
  .blank-rule { height: 1px; background: var(--ink); margin: 26px 0 20px; }
  .blank h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0 0 10px; }
  .blank p:not(.blank-no) { margin: 0 0 24px; color: var(--ink-2); font-size: 14px; }
  .blank-links { display: flex; gap: 18px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; }
  .kicker { margin-bottom: 20px; }
</style>
</head>
<body>
<div class="blank">
  <p class="kicker">Fe Cloud · 改版档案</p>
  <p class="blank-no">4<span>0</span>4</p>
  <div class="blank-rule"></div>
  <h1>这一页没有内容</h1>
  <p>路径可能已经移动，或者链接拼写有误。档案本身仍在。</p>
  <div class="blank-links">
    <a href="./">回到封面</a>
    <a href="./#ledger">变更台账</a>
    <a href="./#qa">问答</a>
  </div>
</div>
</body>
</html>
